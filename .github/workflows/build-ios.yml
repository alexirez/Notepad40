name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore
        run: dotnet restore Notepad40/Notepad40.csproj -p:TargetFramework=net10.0-ios

      - name: Build iOS (unsigned)
        run: dotnet build Notepad40/Notepad40.csproj -f net10.0-ios -c Release --no-restore -o ./publish-ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad40-ios
          path: ./publish-ios
