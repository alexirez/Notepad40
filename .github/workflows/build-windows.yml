name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore workloads
        run: dotnet workload restore Notepad40/Notepad40.csproj

      - name: Restore
        run: dotnet restore Notepad40/Notepad40.csproj -p:TargetFramework=net10.0-windows10.0.19041.0 -p:RuntimeIdentifier=win-x64 -p:UseMonoRuntime=false --packages ./nuget-packages

      - name: Publish Windows app
        run: dotnet publish Notepad40/Notepad40.csproj -f net10.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifier=win-x64 -p:UseMonoRuntime=false -o ./publish-windows --no-restore -p:RestorePackagesPath=./nuget-packages

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad40-windows
          path: ./publish-windows
