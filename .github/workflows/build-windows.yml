name: Build (Windows)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore
        run: dotnet restore Notepad40/Notepad40.csproj -p:UseMonoRuntime=false -v detailed

      - name: Publish
        run: dotnet publish Notepad40/Notepad40.csproj -f net10.0-windows10.0.19041.0 -c Release -r win-x64 -p:UseMonoRuntime=false -o ./publish-windows --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: notepad40-windows
          path: ./publish-windows
